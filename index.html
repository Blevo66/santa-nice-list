<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Santa's Nice List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/*
VOICE: old, storybook, a little magical, readable across the grotto
IDEA: a page from Santa's centuries-old ledger, names turning past on a brass-and-wood reading wheel
PICTURE: one drum of names rolling upward; the name at the centre stops, grows and is inked in under a gilded band
COLOUR and TYPE: deep holly wall, aged foxed parchment, sepia and oxblood ink, tarnished gold; IM Fell English (old printed type) throughout
LAYOUT: landscape 16:9, title across the top, the wheel filling the page beneath
*/
:root{color-scheme:dark;--wall:#5a0a14;--wall2:#2c0408;--paper:#efe0bb;--paper2:#d9c08c;--edge:#a77e43;--ink:#2e1a0c;--ink2:#6b4a2b;--ox:#7d1420;--gold:#a8823a;--gold2:#d9b766}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--wall),var(--wall2) 80%);color:var(--ink);font:16px/1.4 "IM Fell English",Georgia,serif}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin 4.5vmin}

/* the aged page */
.page{position:relative;width:100%;height:100%;max-width:178vh;display:flex;flex-direction:column;padding:max(9vmin,8.3vw) 6vmin 3.5vmin;
  background:
    radial-gradient(circle at 12% 18%,rgba(140,90,30,.16) 0 3vmin,transparent 7vmin),
    radial-gradient(circle at 86% 78%,rgba(140,90,30,.14) 0 4vmin,transparent 9vmin),
    radial-gradient(circle at 70% 12%,rgba(140,90,30,.10) 0 2vmin,transparent 5vmin),
    radial-gradient(ellipse at 50% 45%,var(--paper) 30%,var(--paper2) 85%,var(--edge) 120%);
  box-shadow:0 2vmin 6vmin rgba(0,0,0,.55),inset 0 0 8vmin rgba(110,60,15,.45)}
/* scroll rods */
.rod{position:absolute;left:-1.6vmin;right:-1.6vmin;height:3.6vmin;border-radius:2vmin;z-index:2;
  background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0) 40%,rgba(0,0,0,.22)),repeating-linear-gradient(-55deg,#c8102e 0 1.3vmin,#fbf7f2 1.3vmin 2.6vmin);
  box-shadow:0 .6vmin 1.4vmin rgba(0,0,0,.45)}
.rod::before,.rod::after{content:"";position:absolute;top:50%;width:4.8vmin;height:4.8vmin;margin-top:-2.4vmin;border-radius:50%;box-shadow:0 .3vmin .8vmin rgba(0,0,0,.4);
  background:radial-gradient(circle,#fff 0 16%,transparent 17%),radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),transparent 45%),repeating-conic-gradient(#c8102e 0 22.5deg,#fbf7f2 22.5deg 45deg)}
.rod::before{left:-2vmin}.rod::after{right:-2vmin}
.rod.top{top:-1.8vmin}.rod.bot{bottom:-1.8vmin}
/* ruled border */
.frame{position:absolute;inset:2.6vmin 3.4vmin;border:2px solid rgba(107,74,43,.55);pointer-events:none}
.frame::before{content:"";position:absolute;inset:.7vmin;border:1px solid rgba(107,74,43,.4)}

header{text-align:center;flex:none;position:relative;z-index:1}
h1{margin:0;font:400 clamp(30px,9.5vmin,140px)/1 "IM Fell English SC",Georgia,serif;color:var(--ox);text-shadow:0 .2vmin 0 rgba(255,245,220,.5)}
.sub{margin:.4vmin 0 0;font:italic 400 clamp(14px,2.8vmin,40px)/1.2 "IM Fell English",Georgia,serif;color:var(--ink2)}
#sub{display:none}
.flourish{display:block;margin:1vmin auto 0;width:min(46vmin,60%);height:2.4vmin;color:var(--ink2);opacity:.7}

/* the wheel */
#wheel{flex:1;position:relative;overflow:hidden}
.band{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-50%);height:var(--bandH,26%);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(217,183,102,.28) 18%,rgba(217,183,102,.38) 50%,rgba(217,183,102,.28) 82%,transparent);
  border-block:2px solid rgba(168,130,58,.75);box-shadow:0 -5px 0 -3px rgba(168,130,58,.45),0 5px 0 -3px rgba(168,130,58,.45)}
#drum{position:absolute;inset:0;width:100%;height:100%}

.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:italic 400 clamp(20px,5.5vmin,80px)/1.2 "IM Fell English",Georgia,serif;color:var(--ink2);padding:0 8%;z-index:1}
.msg[hidden]{display:none}
.msg small{display:block;font:italic 400 clamp(12px,2.2vmin,28px)/1.4 "IM Fell English",serif;margin-top:1.4vmin}
#status{position:fixed;left:1.2vmin;bottom:.8vmin;z-index:4;font:12px/1.3 system-ui,sans-serif;color:rgba(255,235,220,.45)}

/* staff controls */
#dayBtn{position:fixed;right:2vmin;bottom:1.6vmin;z-index:6;font:400 20px/1 "IM Fell English",Georgia,serif;padding:12px 22px;border-radius:6px;border:2px solid var(--gold);
  background:rgba(44,4,8,.9);color:#f3e3bd;cursor:pointer;transition:opacity .5s;min-height:48px}
#dayBtn.idle{opacity:0;pointer-events:none}
body.idle{cursor:none}
#dayBtn:focus-visible,.dayOpt:focus-visible,#closePanel:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
#panel{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(20,3,6,.6)}
#panel[hidden]{display:none}
.panelIn{background:radial-gradient(ellipse at 50% 40%,var(--paper),var(--paper2) 120%);color:var(--ink);border-radius:6px;border:2px solid var(--edge);padding:26px 30px;width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.panelIn h2{margin:0 0 4px;font:400 36px/1.1 "IM Fell English SC",Georgia,serif;color:var(--ox)}
.panelIn p{margin:0 0 16px;font:italic 17px/1.4 "IM Fell English",Georgia,serif;color:var(--ink2)}
.dayOpt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin:0 0 8px;padding:12px 16px;min-height:52px;border-radius:4px;border:1px solid rgba(107,74,43,.45);
  background:rgba(255,250,235,.5);color:var(--ink);font:400 20px/1.2 "IM Fell English",Georgia,serif;cursor:pointer;text-align:left}
.dayOpt span{font-style:italic;font-size:16px;color:var(--ink2);white-space:nowrap}
.dayOpt.on{border:2px solid var(--ox);background:#fff8e6}
.dayOpt:disabled{opacity:.45;cursor:default}
#closePanel{margin-top:6px;background:transparent;border:0;font:italic 17px "IM Fell English",serif;color:var(--ink2);padding:12px;cursor:pointer;min-height:44px}

/* falling snow: three tiled layers moved by the compositor only (no script, no repaint) */
.snow{position:fixed;left:0;right:0;top:calc(var(--t) * -1);bottom:0;pointer-events:none;z-index:3;opacity:.5;background-repeat:repeat;will-change:transform;animation:fall var(--d) linear infinite}
.snow.s1{--t:260px;--d:26s;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='260'%20height='260'%3E%3Cg%20fill='%23fff'%3E%3Ccircle%20cx='84.2'%20cy='39.2'%20r='1.6'%20fill-opacity='0.57'/%3E%3Ccircle%20cx='139.3'%20cy='95.1'%20r='1.1'%20fill-opacity='0.70'/%3E%3Ccircle%20cx='9.7'%20cy='112.7'%20r='1.1'%20fill-opacity='0.58'/%3E%3Ccircle%20cx='110.4'%20cy='215.0'%20r='1.1'%20fill-opacity='0.62'/%3E%3Ccircle%20cx='163.1'%20cy='246.4'%20r='1.5'%20fill-opacity='0.67'/%3E%3Ccircle%20cx='253.8'%20cy='12.1'%20r='1.8'%20fill-opacity='0.64'/%3E%3Ccircle%20cx='37.5'%20cy='30.6'%20r='1.3'%20fill-opacity='0.79'/%3E%3Ccircle%20cx='47.0'%20cy='151.2'%20r='1.6'%20fill-opacity='0.66'/%3E%3Ccircle%20cx='142.4'%20cy='16.3'%20r='1.1'%20fill-opacity='0.61'/%3E%3Ccircle%20cx='176.9'%20cy='111.2'%20r='1.3'%20fill-opacity='0.73'/%3E%3Ccircle%20cx='117.8'%20cy='77.9'%20r='1.7'%20fill-opacity='0.76'/%3E%3Ccircle%20cx='63.5'%20cy='149.4'%20r='1.5'%20fill-opacity='0.81'/%3E%3Ccircle%20cx='189.7'%20cy='74.9'%20r='1.9'%20fill-opacity='0.59'/%3E%3Ccircle%20cx='108.7'%20cy='196.9'%20r='1.1'%20fill-opacity='0.70'/%3E%3Ccircle%20cx='10.2'%20cy='173.7'%20r='1.7'%20fill-opacity='0.72'/%3E%3Ccircle%20cx='227.6'%20cy='81.6'%20r='1.6'%20fill-opacity='0.73'/%3E%3Ccircle%20cx='150.8'%20cy='118.6'%20r='1.8'%20fill-opacity='0.83'/%3E%3Ccircle%20cx='123.3'%20cy='172.7'%20r='1.1'%20fill-opacity='0.76'/%3E%3Ccircle%20cx='168.3'%20cy='258.2'%20r='1.7'%20fill-opacity='0.64'/%3E%3Ccircle%20cx='100.3'%20cy='173.8'%20r='1.0'%20fill-opacity='0.69'/%3E%3Ccircle%20cx='43.7'%20cy='30.4'%20r='1.1'%20fill-opacity='0.78'/%3E%3Ccircle%20cx='33.6'%20cy='64.4'%20r='1.4'%20fill-opacity='0.81'/%3E%3Ccircle%20cx='21.0'%20cy='116.8'%20r='1.5'%20fill-opacity='0.82'/%3E%3Ccircle%20cx='213.0'%20cy='224.6'%20r='1.3'%20fill-opacity='0.67'/%3E%3Ccircle%20cx='93.3'%20cy='229.9'%20r='1.9'%20fill-opacity='0.60'/%3E%3Ccircle%20cx='45.8'%20cy='60.3'%20r='1.2'%20fill-opacity='0.70'/%3E%3Ccircle%20cx='153.2'%20cy='68.3'%20r='1.0'%20fill-opacity='0.68'/%3E%3Ccircle%20cx='96.0'%20cy='147.2'%20r='1.9'%20fill-opacity='0.76'/%3E%3Ccircle%20cx='134.0'%20cy='160.6'%20r='1.6'%20fill-opacity='0.57'/%3E%3Ccircle%20cx='233.9'%20cy='202.8'%20r='1.8'%20fill-opacity='0.79'/%3E%3Ccircle%20cx='102.0'%20cy='103.7'%20r='1.1'%20fill-opacity='0.74'/%3E%3Ccircle%20cx='16.2'%20cy='17.5'%20r='1.2'%20fill-opacity='0.60'/%3E%3Ccircle%20cx='88.4'%20cy='13.7'%20r='1.0'%20fill-opacity='0.60'/%3E%3Ccircle%20cx='26.4'%20cy='94.5'%20r='1.0'%20fill-opacity='0.81'/%3E%3Ccircle%20cx='159.7'%20cy='38.6'%20r='1.2'%20fill-opacity='0.65'/%3E%3Ccircle%20cx='94.7'%20cy='31.9'%20r='1.8'%20fill-opacity='0.85'/%3E%3Ccircle%20cx='121.2'%20cy='125.8'%20r='1.1'%20fill-opacity='0.58'/%3E%3Ccircle%20cx='89.1'%20cy='68.8'%20r='1.7'%20fill-opacity='0.60'/%3E%3Ccircle%20cx='6.0'%20cy='247.3'%20r='1.5'%20fill-opacity='0.59'/%3E%3Ccircle%20cx='141.2'%20cy='7.0'%20r='1.5'%20fill-opacity='0.84'/%3E%3Ccircle%20cx='224.5'%20cy='181.0'%20r='1.2'%20fill-opacity='0.66'/%3E%3Ccircle%20cx='43.4'%20cy='200.7'%20r='1.5'%20fill-opacity='0.78'/%3E%3C/g%3E%3C/svg%3E")}
.snow.s2{--t:360px;--d:19s;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='360'%20height='360'%3E%3Cg%20fill='%23fff'%3E%3Ccircle%20cx='118.7'%20cy='80.3'%20r='3.0'%20fill-opacity='0.95'/%3E%3Ccircle%20cx='306.9'%20cy='290.2'%20r='3.0'%20fill-opacity='0.88'/%3E%3Ccircle%20cx='81.6'%20cy='186.3'%20r='2.6'%20fill-opacity='0.71'/%3E%3Ccircle%20cx='10.1'%20cy='100.6'%20r='2.5'%20fill-opacity='0.87'/%3E%3Ccircle%20cx='344.3'%20cy='161.0'%20r='3.1'%20fill-opacity='0.95'/%3E%3Ccircle%20cx='343.8'%20cy='131.3'%20r='2.4'%20fill-opacity='0.76'/%3E%3Ccircle%20cx='70.8'%20cy='73.6'%20r='2.8'%20fill-opacity='0.93'/%3E%3Ccircle%20cx='302.6'%20cy='172.6'%20r='2.9'%20fill-opacity='0.90'/%3E%3Ccircle%20cx='30.5'%20cy='237.8'%20r='3.1'%20fill-opacity='0.90'/%3E%3Ccircle%20cx='270.1'%20cy='172.1'%20r='2.4'%20fill-opacity='0.90'/%3E%3Ccircle%20cx='119.7'%20cy='288.3'%20r='3.2'%20fill-opacity='0.80'/%3E%3Ccircle%20cx='144.5'%20cy='340.8'%20r='2.9'%20fill-opacity='0.74'/%3E%3Ccircle%20cx='45.7'%20cy='54.4'%20r='3.1'%20fill-opacity='0.90'/%3E%3Ccircle%20cx='52.6'%20cy='297.5'%20r='3.2'%20fill-opacity='0.86'/%3E%3Ccircle%20cx='126.1'%20cy='197.5'%20r='2.3'%20fill-opacity='0.70'/%3E%3Ccircle%20cx='349.5'%20cy='233.9'%20r='2.7'%20fill-opacity='0.93'/%3E%3Ccircle%20cx='156.2'%20cy='313.8'%20r='3.0'%20fill-opacity='0.75'/%3E%3Ccircle%20cx='90.7'%20cy='105.5'%20r='2.4'%20fill-opacity='0.85'/%3E%3Ccircle%20cx='93.4'%20cy='150.8'%20r='2.3'%20fill-opacity='0.93'/%3E%3Ccircle%20cx='127.4'%20cy='164.9'%20r='2.8'%20fill-opacity='0.93'/%3E%3Ccircle%20cx='151.4'%20cy='330.4'%20r='2.7'%20fill-opacity='0.83'/%3E%3Ccircle%20cx='188.5'%20cy='6.7'%20r='2.6'%20fill-opacity='0.75'/%3E%3C/g%3E%3C/svg%3E")}
.snow.s3{--t:520px;--d:14s;opacity:.35;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='520'%20height='520'%3E%3Cg%20fill='%23fff'%3E%3Ccircle%20cx='2.0'%20cy='415.6'%20r='4.1'%20fill-opacity='0.89'/%3E%3Ccircle%20cx='522.0'%20cy='415.6'%20r='4.1'%20fill-opacity='0.89'/%3E%3Ccircle%20cx='377.1'%20cy='289.4'%20r='4.3'%20fill-opacity='0.90'/%3E%3Ccircle%20cx='288.8'%20cy='407.8'%20r='4.0'%20fill-opacity='0.91'/%3E%3Ccircle%20cx='129.2'%20cy='144.0'%20r='5.0'%20fill-opacity='0.90'/%3E%3Ccircle%20cx='292.1'%20cy='395.2'%20r='5.3'%20fill-opacity='0.89'/%3E%3Ccircle%20cx='318.5'%20cy='262.9'%20r='4.6'%20fill-opacity='0.94'/%3E%3Ccircle%20cx='235.2'%20cy='277.3'%20r='4.6'%20fill-opacity='0.99'/%3E%3Ccircle%20cx='363.6'%20cy='455.8'%20r='5.3'%20fill-opacity='0.85'/%3E%3Ccircle%20cx='290.9'%20cy='490.5'%20r='5.1'%20fill-opacity='0.83'/%3E%3C/g%3E%3C/svg%3E")}
@keyframes fall{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,var(--t),0)}}
@media (prefers-reduced-motion:reduce){.snow{animation:none}}


/* Christmas dressing (sweets, elves, candy canes, snowy trees): static pictures, plus twinkling lights animated on opacity only */
.garlandWrap{position:absolute;left:-1vmin;right:-1vmin;top:-2.6vmin;z-index:3;pointer-events:none}
.garland{display:block;width:100%;height:auto;filter:drop-shadow(0 .5vmin .5vmin rgba(40,20,5,.35))}
.lights i{position:absolute;width:1.1vmin;height:1.1vmin;margin:-.55vmin 0 0 -.55vmin;border-radius:50%;background:var(--c);
  box-shadow:0 0 1.4vmin .4vmin var(--c);opacity:.35;will-change:opacity;animation:twinkle 1.3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:1}}
.canes{position:absolute;bottom:-3vmin;width:16vmin;height:18vmin;z-index:4;pointer-events:none;filter:drop-shadow(0 .4vmin .5vmin rgba(60,30,10,.3))}
.canes.l{left:2.5vmin}.canes.r{right:2.5vmin;transform:scaleX(-1)}
.canes svg{position:absolute}
.canes .c1,.canes .c2{bottom:0;width:7vmin;height:17vmin}
.canes .c1{left:2vmin;transform:rotate(14deg);transform-origin:50% 100%}
.canes .c2{left:6.5vmin;transform:scaleX(-1) rotate(14deg);transform-origin:50% 100%}
.canes .bow{left:3.3vmin;bottom:4.6vmin;width:9vmin;height:7.2vmin}
.bandMint{position:absolute;top:calc(50% - var(--rowH,80px)*.35);width:calc(var(--rowH,80px)*.7);height:calc(var(--rowH,80px)*.7);filter:drop-shadow(0 2px 3px rgba(60,30,10,.3))}
.bandMint svg{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;will-change:rotate}
/* what the stripes look like smeared by speed: pink swirl, white centre and rim; faded in only at top speed */
.mintBlur{position:absolute;inset:0;border-radius:50%;opacity:0;will-change:opacity;
  background:radial-gradient(circle,#fff 0 27%,rgba(255,255,255,0) 31%,rgba(255,255,255,0) 88%,#fff 91%),conic-gradient(#e6909c,#f2c3ca,#e6909c,#f2c3ca,#e6909c,#f2c3ca,#e6909c,#f2c3ca,#e6909c)}
.bandMint.l{left:2%}.bandMint.r{right:2%}
@media (prefers-reduced-motion:reduce){.lights i{animation:none;opacity:.8}}

/* subtle fairy lights down the sides (opacity-only twinkle) */
.sideLights{position:absolute;top:5vmin;bottom:5vmin;width:3.4vmin;z-index:1;pointer-events:none}
.sideLights.l{left:-4.1vmin}.sideLights.r{right:-4.1vmin;transform:scaleX(-1)}
.sideLights svg{position:absolute;inset:0;width:100%;height:100%}
.sideLights i{position:absolute;width:1.2vmin;height:1.6vmin;margin:-.8vmin 0 0 -.6vmin;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 40%,#fff 0 25%,var(--c) 60%);
  box-shadow:0 0 1.2vmin .35vmin var(--c);opacity:1;animation:none}
/* the bulb stays fully lit; its halo sparkles (opacity + scale only, handled by the graphics side) */
.sideLights i::after{content:"";position:absolute;left:50%;top:50%;width:5vmin;height:5vmin;margin:-2.5vmin 0 0 -2.5vmin;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 85%,#fff) 0 12%,color-mix(in srgb,var(--c) 40%,transparent) 35%,transparent 70%);
  opacity:.45;will-change:opacity,transform;animation-name:sparkleGlow;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-duration:inherit;animation-delay:inherit}
@keyframes sparkleGlow{0%,40%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}62%,100%{opacity:.45;transform:scale(.85)}}
@media (prefers-reduced-motion:reduce){.sideLights i::after{animation:none}}

/* gentle sway: rotate only (graphics side), never the names */
.swing{position:absolute;top:0;width:10%;height:100%;display:block;transform-origin:50% 15%;will-change:rotate;
  animation-name:sway;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes sway{from{rotate:-5deg}to{rotate:5deg}}
.canes{transform-origin:50% 100%;will-change:rotate;animation:swayCane 6s ease-in-out infinite alternate}
.canes.r{animation-duration:6.8s;animation-delay:-2s}
@keyframes swayCane{from{rotate:-1.5deg}to{rotate:1.5deg}}
@media (prefers-reduced-motion:reduce){.swing,.canes{animation:none}}
</style>

<script>
{
const DATA_URL = 'names.json';
const HOLD_MS = 4500;       // how long each name rests in the gold band
const ROLL_MS = 1700;       // how long the wheel takes to turn to the next name
const STEP_DEG = 24;        // spacing between names around the drum
const SLOTS = 3;            // names shown above and below the centre
const FRAME_MS = 1000 / 30;   // the wheel redraws at most 30 times a second

const $ = s => document.querySelector(s);
const drum = $('#drum'), dctx = drum.getContext('2d', {alpha: true});
const msgEl = $('#msg'), subEl = $('#sub'), statusEl = $('#status'), wheel = $('#wheel');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let names = [], lastKey = '', haveData = false;

/* ---------- the wheel: one canvas, only drawn while it is turning ---------- */
let pos = 0, R = 300, nameSize = 90, W = 0, H = 0, rolling = false, holdTimer = null;
const NAME_FONT = '"IM Fell English", Georgia, serif';
const INK = [46, 26, 12], OX = [125, 20, 32];

function layout(){
  W = wheel.clientWidth; H = wheel.clientHeight;
  drum.width = W; drum.height = H;                         // 1:1 pixels, the cheapest canvas there is
  R = H * 0.62;
  nameSize = Math.min(H * 0.2, W * 0.12);
  wheel.style.setProperty('--rowH', nameSize + 'px');
  wheel.style.setProperty('--bandH', (nameSize * 1.45 / H * 100) + '%');
  draw();
}
const wheelRo = new ResizeObserver(layout); wheelRo.observe(wheel);

const ease = t => (1 - Math.cos(Math.PI * t)) / 2;

function draw(){
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.clearRect(0, 0, W, H);
  const n = names.length;
  if (!n || !W) return;
  dctx.textAlign = 'center'; dctx.textBaseline = 'alphabetic';
  dctx.font = '400 ' + nameSize + 'px ' + NAME_FONT;
  // centre on the capital letters, not the font's em box (IM Fell sits low with 'middle')
  const capH = dctx.measureText('H').actualBoundingBoxAscent || nameSize * 0.68;
  const base = Math.floor(pos), frac = pos - base;
  for (let k = -SLOTS - 1; k <= SLOTS + 1; k++){
    if (n === 1 && k !== 0) continue;
    const off = k - frac, a = off * STEP_DEG * Math.PI / 180;
    if (Math.abs(a) >= Math.PI / 2) continue;
    const cos = Math.cos(a), near = Math.max(0, 1 - Math.abs(off));
    const y = H / 2 + R * Math.sin(a);
    const edge = Math.min(1, y / (H * 0.2), (H - y) / (H * 0.2));
    const alpha = Math.pow(cos, 3) * (0.55 + 0.45 * near) * Math.max(0, edge);
    if (alpha <= 0.01) continue;
    const grow = 0.62 + 0.38 * near * near;
    const c = INK.map((v, i) => Math.round(v + (OX[i] - v) * near));
    dctx.fillStyle = 'rgb(' + c.join(',') + ')';
    dctx.globalAlpha = alpha;
    dctx.setTransform(grow, 0, 0, grow * cos, W / 2, y);
    dctx.fillText(names[((base + k) % n + n) % n], 0, capH / 2);
  }
  dctx.globalAlpha = 1;
}

function scheduleRoll(){
  clearTimeout(holdTimer);
  if (names.length > 1) holdTimer = setTimeout(roll, HOLD_MS);   // nothing runs while a name rests
}
function roll(){
  if (document.hidden){ scheduleRoll(); return; }
  const from = pos; let start = 0, lastDraw = 0; rolling = true;
  // the peppermints either side of the band spin like rollers turning the wheel (rotate only, graphics side)
  if (!reduce) document.querySelectorAll('.bandMint').forEach((m, i) => {
    const turns = 1, ease = 'cubic-bezier(.45,0,.55,1)';
    m.querySelector('svg').animate([{rotate: '0deg'}, {rotate: (i ? 360 : -360) * turns + 'deg'}], {duration: ROLL_MS, easing: ease});
    m.querySelector('.mintBlur').animate([{opacity: 0}, {opacity: .3, offset: .3}, {opacity: .5, offset: .5}, {opacity: .3, offset: .7}, {opacity: 0}], {duration: ROLL_MS});
  });
  function step(t){
    if (!start) start = t;
    if (t - lastDraw < FRAME_MS - 2 && t - start < ROLL_MS){ requestAnimationFrame(step); return; }   // cap at 30fps
    lastDraw = t;
    const p = reduce ? 1 : Math.min(1, (t - start) / ROLL_MS);
    pos = from + ease(p);
    if (p >= 1){ pos = Math.round(pos) % names.length; rolling = false; draw(); scheduleRoll(); return; }
    draw(); requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function resetWheel(){ clearTimeout(holdTimer); pos = 0; layout(); if (!rolling) scheduleRoll(); }

function showMsg(big, small){
  names = []; lastKey = ''; clearTimeout(holdTimer); draw();
  wheel.querySelector('.band').style.visibility = 'hidden';
  msgEl.hidden = false; msgEl.innerHTML = '';
  const d = document.createElement('div'); d.textContent = big;
  if (small){ const s = document.createElement('small'); s.textContent = small; d.appendChild(s); }
  msgEl.appendChild(d);
}
/* random order, with no two identical names next to each other (including last → first, since the wheel loops) */
const nameKey = n => n.trim().toLowerCase();
function clashes(a){ let c = 0; for (let i = 0; i < a.length; i++) if (a.length > 1 && nameKey(a[i]) === nameKey(a[(i + 1) % a.length])) c++; return c; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function randomOrder(list){
  let best = shuffle(list), bestC = clashes(best);
  for (let t = 0; t < 400 && bestC; t++){ const a = shuffle(list), c = clashes(a); if (c < bestC){ best = a; bestC = c; } }
  return best;   // only keeps a clash if it's impossible to avoid (e.g. most of the list is one name)
}
function showNames(list){
  names = randomOrder(list); msgEl.hidden = true;
  wheel.querySelector('.band').style.visibility = '';
  resetWheel();
}

/* ---------- data ---------- */
let days = [], choice = null;   // choice = 'YYYY-MM-DD' chosen by staff, or null for automatic
try { choice = localStorage.getItem('nl-day'); } catch(e){}
const fmt = iso => { const [yy, m, d] = iso.split('-').map(Number); return new Date(yy, m - 1, d).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}); };
const todayIso = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };

function autoPick(){
  const t = todayIso(), dated = days.filter(d => d.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const today = dated.find(d => d.date === t); if (today) return {day: today, when: 'today'};
  const next = dated.find(d => d.date > t && d.names.length); if (next) return {day: next, when: 'next'};
  const past = dated.filter(d => d.names.length).pop(); return past ? {day: past, when: 'past'} : null;
}
function current(){
  if (choice){ const d = days.find(x => x.date === choice); if (d) return {day: d, when: d.date === todayIso() ? 'today' : 'chosen'}; }
  return autoPick();
}

function render(){
  const pick = current();
  if (!pick){ subEl.textContent = 'Lincolnshire Wildlife Park'; showMsg('The list is still being written\u2026', 'No names on the sheet yet.'); return; }
  const {day, when} = pick;
  const nice = day.date ? fmt(day.date) : day.label;
  subEl.textContent = when === 'today' ? 'Today, ' + nice : when === 'next' ? 'Coming to see Santa on ' + nice : nice;
  const list = (day.names || []).map(String).filter(Boolean);
  if (!list.length){ showMsg('The list is still being written\u2026', 'No names for ' + nice + ' yet.'); return; }
  const key = nice + '|' + list.join('|');
  if (key === lastKey) return;
  lastKey = key; showNames(list);
}

/* ---------- day picker for staff ---------- */
const dayBtn = $('#dayBtn'), panel = $('#panel'), dayList = $('#dayList');
let idleTimer = null;
function wakeBtn(){ dayBtn.classList.remove('idle'); clearTimeout(idleTimer); document.body.classList.remove('idle'); idleTimer = setTimeout(() => { if (panel.hidden){ dayBtn.classList.add('idle'); document.body.classList.add('idle'); } }, 4000); }
['mousemove','pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, wakeBtn, {passive: true}));
wakeBtn();

function opt(label, note, on, disabled, onPick){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'dayOpt' + (on ? ' on' : '');
  b.textContent = label; const sp = document.createElement('span'); sp.textContent = note; b.appendChild(sp);
  b.disabled = !!disabled; b.onclick = e => { e.stopPropagation(); onPick(); };
  return b;
}
function choose(c){
  choice = c; try { c ? localStorage.setItem('nl-day', c) : localStorage.removeItem('nl-day'); } catch(e){}
  closePanel(); lastKey = ''; render();
}
function openPanel(){
  const items = [opt('Automatic', 'today, or the next grotto day', !choice, false, () => choose(null))];
  days.filter(d => d.date).forEach(d => items.push(opt(fmt(d.date), d.names.length + (d.names.length === 1 ? ' name' : ' names'), choice === d.date, !d.names.length, () => choose(d.date))));
  dayList.replaceChildren(...items);
  panel.hidden = false; (dayList.querySelector('.on') || dayList.firstChild).focus();
}
function closePanel(){ panel.hidden = true; wakeBtn(); dayBtn.focus(); }
dayBtn.addEventListener('click', e => { e.stopPropagation(); openPanel(); });
$('#closePanel').addEventListener('click', e => { e.stopPropagation(); closePanel(); });
panel.addEventListener('click', e => { e.stopPropagation(); if (e.target === panel) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });

async function load(){
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    days = Array.isArray(data.days) ? data.days : (data.names ? [{label: data.label || '', date: data.date || null, names: data.names}] : []);
    days.forEach(d => { d.names = (d.names || []).map(String).filter(Boolean); });
    if (!panel.hidden) openPanel();
    render(); haveData = true;
    statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  } catch (e){
    if (haveData) statusEl.textContent = 'Couldn’t refresh just now, showing the last list';
    else showMsg('Santa can’t reach the list right now', 'Trying again shortly (' + e.message + ').');
  }
}

/* keep the screen awake; click anywhere for full screen */
async function wake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e){} }
wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden){ wake(); load(); } });
function goFull(){ if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen({navigationUI: 'hide'}).catch(() => {}); }
document.addEventListener('click', e => { if (e.target.closest('button,#panel')) return; goFull(); });
document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F' || e.key === 'Enter') && panel.hidden && !e.target.closest('button')) goFull(); });

document.fonts && document.fonts.load('400 40px "IM Fell English"').then(layout, layout);
document.fonts && document.fonts.ready.then(layout);
load(); setInterval(load, 5 * 60 * 1000);
setInterval(() => { if (days.length) render(); }, 60 * 1000);

}
</script>
